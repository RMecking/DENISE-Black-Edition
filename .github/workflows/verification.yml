name: DENISE verification

on:
  pull_request:
    branches: [modernization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Provenance regression tests intentionally inspect historical commits.
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libfftw3-dev python3-pytest python3-numpy

      - name: Build libcseife
        id: build_libcseife
        run: make -C libcseife

      - name: Build DENISE
        id: build_denise
        run: make -C src denise

      - name: Run non-physics harness tests
        run: python3 -m pytest tests --ignore=tests/physics -m 'not integration' -q

      - name: Run mandatory DENISE physics verification
        if: ${{ !cancelled() && steps.build_libcseife.outcome == 'success' && steps.build_denise.outcome == 'success' }}
        env:
          MPIEXEC_FLAGS: --oversubscribe
        run: python3 -m pytest tests/physics -m 'not extended' -v --require-denise
